{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<h1>{% translate "Importar productos desde CSV" %}</h1>

<p>Columnas: <code>sku,name,category,description,price,stock_initial</code>.</p>

<form method="post" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  <div class="form-row">
    <label for="id_file">{% translate "Archivo CSV" %}</label>
    <input type="file" name="file" id="id_file" accept=".csv" required>
  </div>
  <div class="submit-row">
    <input type="submit" value="{% translate "Importar" %}" class="default">
    <a href="../" class="button">{% translate "Cancelar" %}</a>
  </div>
</form>

{% if sample %}
<details style="margin-top: 1em;">
  <summary>Ejemplo</summary>
  <pre>{{ sample }}</pre>
</details>
{% endif %}
{% endblock %}
