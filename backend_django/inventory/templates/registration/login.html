{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte, Servicios y Repuestos Jair S.A.C</title>
    <link rel="stylesheet" href="{% static 'inventory/app.css' %}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-brand">
                <p class="eyebrow">Transporte, Servicios y Repuestos Jair S.A.C</p>
                <h1>Acceso</h1>
            </div>

            <form method="post" class="login-form">
                {% csrf_token %}
                {% if form.errors %}
                    <p class="form-error">Usuario o contraseña incorrectos.</p>
                {% endif %}
                {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                <label>
                    Usuario
                    <input type="text" name="{{ form.username.html_name }}" autocomplete="username" autofocus required>
                </label>
                <label>
                    Contraseña
                    <input type="password" name="{{ form.password.html_name }}" autocomplete="current-password" required>
                </label>
                <button type="submit" class="primary">Entrar</button>
            </form>
        </section>
    </main>
</body>
</html>
